# Publishes this package to npm on every version tag push.
#
# n8n requires community nodes to be published from GitHub Actions with npm
# provenance since May 1 2026. @n8n/node-cli 0.23.0 or newer is needed for the
# provenance flag that `npm run release` passes in CI.
#
# npm authentication, one of:
#
#   OIDC trusted publishing, no stored secret. On npmjs.com open the package
#   settings, Publish access, Trusted Publishers, and add GitHub Actions with
#   owner mac-lucky, repository n8n-nodes-pushward, workflow publish.yml and no
#   environment. Leave the NPM_TOKEN secret unset. Allow direct publishing with
#   npm publish in that configuration, since the release runs it, and make the
#   first release within 2 days of adding it.
#
#   Automation token. Create a granular npm token with read and write access to
#   this package and store it as the NPM_TOKEN repository secret.
#
# Tags are bare versions (0.2.0, not v0.2.0). `npm run release` lints, builds,
# bumps the version, updates the changelog, tags and pushes, and the pushed tag
# starts this workflow.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write above).
        # Lint and build run automatically as part of the release process.
        # With NPM_TOKEN unset the npm config line is skipped and npm uses OIDC.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
